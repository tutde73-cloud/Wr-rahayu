<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Konten — Wr Rahayu Lawar &amp; Soto Sapi</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f8f6;
      --card: #ffffff;
      --green-deep: #143326;
      --green-forest: #1e4635;
      --green-soft: #eef3ef;
      --ink: #17221c;
      --muted: #5c7569;
      --border: #dfe8e2;
      --ok-bg: #e7f5ec;
      --ok-text: #165b33;
      --err-bg: #fdecec;
      --err-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.55;
      padding-bottom: 64px;
    }

    .topbar {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.55rem;
      font-weight: 600;
      color: var(--green-deep);
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--green-forest);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--green-deep);
    }

    .btn-outline {
      background: #ffffff;
      color: var(--green-deep);
      border-color: #c6d6cc;
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--green-soft);
    }

    .container {
      max-width: 1080px;
      margin: 24px auto 0;
      padding: 0 20px;
    }

    .status-banner {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 20px;
      border: 1px solid transparent;
    }

    .status-banner.show {
      display: block;
    }

    .status-banner.ok {
      background: var(--ok-bg);
      color: var(--ok-text);
      border-color: #b7e1c6;
    }

    .status-banner.err {
      background: var(--err-bg);
      color: var(--err-text);
      border-color: #f5c2c2;
    }

    .gallery-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 20px;
    }

    .gallery-panel-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .gallery-panel-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--green-deep);
      margin-bottom: 3px;
    }

    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .card-key {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green-forest);
      background: var(--green-soft);
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .card-name {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--green-deep);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 720px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink);
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd8d0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--ink);
      background: #ffffff;
    }

    .field input:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--green-forest);
    }

    .field textarea {
      min-height: 76px;
      resize: vertical;
    }

    .img-row {
      display: grid;
      grid-template-columns: 124px 1fr;
      gap: 16px;
      align-items: start;
      margin-bottom: 14px;
    }

    @media (max-width: 600px) {
      .img-row {
        grid-template-columns: 1fr;
      }
    }

    .thumb-box {
      width: 124px;
      height: 86px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--green-soft);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .upload-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .file-input-hidden {
      display: none;
    }

    .compress-badge {
      font-size: 0.78rem;
      color: var(--green-forest);
      background: var(--green-soft);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 8px;
    }

    .check-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--ink);
      cursor: pointer;
    }

    .hint {
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand-title">Admin Wr Rahayu</div>
        <div class="brand-sub">Kelola Konten &amp; Foto Wr Rahayu (Denpasar, Bali)</div>
      </div>
      <div class="top-actions">
        <a href="index.html" class="btn btn-outline" target="_blank" rel="noopener">Lihat index.html</a>
        <button type="button" class="btn btn-outline" id="reloadBtn">Muat Ulang</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="statusBanner" class="status-banner" role="status"></div>

    <!-- Panel Upload Foto Galeri ke index.html -->
    <section class="gallery-panel" aria-label="Upload Foto Galeri">
      <div class="gallery-panel-top">
        <div>
          <span class="card-key">Galeri Foto (#galeri)</span>
          <h2 class="gallery-panel-title">Tambah Foto ke Galeri Web</h2>
          <p class="hint">
            Foto otomatis dikompresi (maks 2048px, Q90), diunggah ke folder <code>gallery/</code>, dan disimpan ke database agar muncul di <code>index.html</code>.
          </p>
        </div>
        <div>
          <input type="file" accept="image/*" multiple class="file-input-hidden" id="galleryBatchInput" />
          <button type="button" class="btn btn-primary" id="galleryBatchBtn">+ Upload Foto Galeri</button>
        </div>
      </div>
    </section>

    <div id="sectionsContainer">
      <p class="hint">Memuat konten...</p>
    </div>
  </main>

  <script>
    (function () {
      const SUPABASE_URL = 'https://vbilpcnjqjbemgahqisz.supabase.co';
      const API_KEY = 'sb_publishable_xR8E37P1RueDetxa9cGOhg_iD4lV_ok';
      const STORAGE_BUCKET = 'wr-rahayu-images';
      const MAX_DIM = 2048;
      const JPEG_QUALITY = 0.9;

      const SECTION_LABELS = {
        hero_1: 'Galeri Utama — Slide 1',
        hero_2: 'Galeri Utama — Slide 2',
        hero_3: 'Galeri Utama — Slide 3',
        menu_lawar: 'Menu Andalan — Lawar Sapi',
        menu_soto: 'Menu Andalan — Soto Sapi',
        venue_dining: 'Lokasi & Pemesanan',
        opening_hours: 'Jam Operasional'
      };

      let latestRows = [];

      const container = document.getElementById('sectionsContainer');
      const banner = document.getElementById('statusBanner');
      const reloadBtn = document.getElementById('reloadBtn');
      const galleryBatchInput = document.getElementById('galleryBatchInput');
      const galleryBatchBtn = document.getElementById('galleryBatchBtn');

      function getSectionLabel(key) {
        if (SECTION_LABELS[key]) return SECTION_LABELS[key];
        if (String(key || '').startsWith('gallery_')) {
          const num = String(key).replace('gallery_', '');
          return `Galeri Foto — Item ${num}`;
        }
        return key;
      }

      function formatBytes(bytes) {
        if (!bytes || bytes <= 0) return '0 KB';
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
      }

      function showStatus(type, msg) {
        banner.className = `status-banner show ${type}`;
        banner.textContent = msg;
      }

      function escapeAttr(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function escapeText(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function compressImageFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Gagal membaca berkas gambar.'));
          reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error('Berkas tidak dikenali sebagai gambar valid.'));
            img.onload = () => {
              let { width, height } = img;
              if (width > MAX_DIM || height > MAX_DIM) {
                if (width >= height) {
                  height = Math.round((height * MAX_DIM) / width);
                  width = MAX_DIM;
                } else {
                  width = Math.round((width * MAX_DIM) / height);
                  height = MAX_DIM;
                }
              }

              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, width, height);
              ctx.drawImage(img, 0, 0, width, height);

              canvas.toBlob(
                (blob) => {
                  if (!blob) {
                    reject(new Error('Gagal mengompresi gambar.'));
                    return;
                  }
                  resolve({
                    blob,
                    width,
                    height,
                    originalSize: file.size,
                    compressedSize: blob.size
                  });
                },
                'image/jpeg',
                JPEG_QUALITY
              );
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      async function uploadCompressedToStorage(folderKey, fileName, compressed) {
        const cleanBase = (fileName || 'foto')
          .replace(/\.[^/.]+$/, '')
          .toLowerCase()
          .replace(/[^a-z0-9-_]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'foto';
        const filePath = `${folderKey}/${Date.now()}-${cleanBase}.jpg`;

        const uploadRes = await fetch(
          `${SUPABASE_URL}/storage/v1/object/${encodeURIComponent(STORAGE_BUCKET)}/${encodeURIComponent(filePath)}`,
          {
            method: 'POST',
            headers: {
              apikey: API_KEY,
              Authorization: `Bearer ${API_KEY}`,
              'Content-Type': 'image/jpeg',
              'x-upsert': 'true'
            },
            body: compressed.blob
          }
        );

        if (!uploadRes.ok) {
          const errTxt = await uploadRes.text();
          throw new Error(`Gagal mengunggah foto (${uploadRes.status}): ${errTxt}`);
        }

        return `${SUPABASE_URL}/storage/v1/object/public/${encodeURIComponent(STORAGE_BUCKET)}/${filePath}`;
      }

      function getNextGalleryKeyAndOrder() {
        const galleryRows = latestRows.filter((r) =>
          String(r.section_key || '').startsWith('gallery_')
        );
        let maxNum = 0;
        galleryRows.forEach((r) => {
          const match = String(r.section_key || '').match(/^gallery_(\d+)$/);
          if (match) {
            const n = parseInt(match[1], 10);
            if (n > maxNum) maxNum = n;
          }
        });

        let maxSort = 20;
        latestRows.forEach((r) => {
          const s = Number(r.sort_order);
          if (!Number.isNaN(s) && s > maxSort) maxSort = s;
        });

        return {
          nextKey: `gallery_${maxNum + 1}`,
          nextSort: maxSort + 1
        };
      }

      async function handleBatchGalleryUpload(files) {
        if (!Array.isArray(files) || files.length === 0) return;

        galleryBatchBtn.disabled = true;
        const originalText = galleryBatchBtn.textContent;
        galleryBatchBtn.textContent = 'Mengunggah...';

        let addedCount = 0;

        try {
          for (const file of files) {
            const compressed = await compressImageFile(file);
            const { nextKey, nextSort } = getNextGalleryKeyAndOrder();
            const publicUrl = await uploadCompressedToStorage('gallery', file.name, compressed);

            const cleanTitle = (file.name || 'Foto Galeri')
              .replace(/\.[^/.]+$/, '')
              .replace(/[-_]+/g, ' ')
              .trim() || 'Foto Galeri Wr Rahayu';

            const insertPayload = {
              section_key: nextKey,
              sort_order: nextSort,
              eyebrow: 'Galeri Foto',
              title: cleanTitle,
              body: 'Foto hidangan dan suasana sajian Wr Rahayu di Denpasar.',
              image_url: publicUrl,
              image_alt: `${cleanTitle} di Wr Rahayu Lawar & Soto Sapi Denpasar`,
              is_active: true,
              updated_at: new Date().toISOString()
            };

            const res = await fetch(`${SUPABASE_URL}/rest/v1/wr_rahayu_sections`, {
              method: 'POST',
              headers: {
                apikey: API_KEY,
                Authorization: `Bearer ${API_KEY}`,
                'Content-Type': 'application/json',
                Prefer: 'return=representation'
              },
              body: JSON.stringify(insertPayload)
            });

            if (!res.ok) {
              const errTxt = await res.text();
              throw new Error(`Gagal menyimpan ${nextKey} ke database (${res.status}): ${errTxt}`);
            }

            const insertedRows = await res.json();
            if (Array.isArray(insertedRows) && insertedRows.length > 0) {
              latestRows.push(insertedRows[0]);
            } else {
              latestRows.push(insertPayload);
            }
            addedCount += 1;
          }

          renderCards(latestRows);
          showStatus(
            'ok',
            `${addedCount} foto galeri berhasil diunggah dan ditambahkan ke index.html.`
          );
        } catch (err) {
          if (addedCount > 0) renderCards(latestRows);
          showStatus('err', err.message || 'Gagal mengunggah foto galeri.');
        } finally {
          galleryBatchBtn.disabled = false;
          galleryBatchBtn.textContent = originalText;
        }
      }

      async function handleImageUpload(sectionKey, file, card, btnEl) {
        const originalBtnText = btnEl.textContent;
        btnEl.disabled = true;
        btnEl.textContent = 'Mengompresi...';

        const badgeEl = card.querySelector('.compress-badge');
        const urlInput = card.querySelector('input[data-field="image_url"]');
        const thumbBox = card.querySelector('.thumb-box');

        try {
          const compressed = await compressImageFile(file);
          btnEl.textContent = 'Mengunggah...';

          const folderKey = String(sectionKey || '').startsWith('gallery_') ? 'gallery' : sectionKey;
          const publicUrl = await uploadCompressedToStorage(folderKey, file.name, compressed);

          urlInput.value = publicUrl;
          thumbBox.innerHTML = `<img src="${escapeAttr(publicUrl)}" alt="Preview" />`;

          const infoText = `${formatBytes(compressed.originalSize)} → ${formatBytes(compressed.compressedSize)} (${compressed.width}×${compressed.height}px)`;
          if (badgeEl) badgeEl.textContent = infoText;

          showStatus(
            'ok',
            `Foto diproses (${infoText}) dan diunggah. Klik "Simpan Perubahan" untuk menerapkan ke halaman.`
          );
        } catch (err) {
          showStatus('err', err.message || 'Gagal memproses atau mengunggah gambar.');
        } finally {
          btnEl.disabled = false;
          btnEl.textContent = originalBtnText;
        }
      }

      function renderCards(rows) {
        if (!Array.isArray(rows) || rows.length === 0) {
          container.innerHTML = '<div class="section-card"><p>Belum ada konten yang tersimpan di database.</p></div>';
          return;
        }

        container.innerHTML = rows.map((row) => {
          const k = row.section_key;
          const label = getSectionLabel(k);
          const isGalleryItem = String(k || '').startsWith('gallery_');
          const imgPreview = row.image_url
            ? `<img src="${escapeAttr(row.image_url)}" alt="${escapeAttr(row.image_alt || label)}" />`
            : '<span>Tanpa gambar</span>';

          const extraFieldsHtml = isGalleryItem
            ? ''
            : `
              <div class="grid-2">
                <div class="field">
                  <label>Label Tambahan 1 (Ruang / Jam 1)</label>
                  <input type="text" data-field="extra_1_label" value="${escapeAttr(row.extra_1_label)}" />
                </div>
                <div class="field">
                  <label>Isi / Waktu Tambahan 1</label>
                  <input type="text" data-field="extra_1_value" value="${escapeAttr(row.extra_1_value)}" />
                </div>
                <div class="field">
                  <label>Label Tambahan 2 (Ruang / Jam 2)</label>
                  <input type="text" data-field="extra_2_label" value="${escapeAttr(row.extra_2_label)}" />
                </div>
                <div class="field">
                  <label>Isi / Waktu Tambahan 2</label>
                  <input type="text" data-field="extra_2_value" value="${escapeAttr(row.extra_2_value)}" />
                </div>
              </div>
            `;

          return `
            <article class="section-card" data-key="${escapeAttr(k)}">
              <div class="card-head">
                <div>
                  <span class="card-key">${escapeText(k)}</span>
                  <h2 class="card-name">${escapeText(label)}</h2>
                </div>
                <button type="button" class="btn btn-primary save-btn" data-save-key="${escapeAttr(k)}">Simpan Perubahan</button>
              </div>

              <div class="grid-2">
                <div class="field">
                  <label>Eyebrow / Label Kecil</label>
                  <input type="text" data-field="eyebrow" value="${escapeAttr(row.eyebrow)}" />
                </div>
                <div class="field">
                  <label>Judul Utama</label>
                  <input type="text" data-field="title" value="${escapeAttr(row.title)}" />
                </div>
              </div>

              <div class="field">
                <label>Deskripsi / Teks Paragraf</label>
                <textarea data-field="body">${escapeText(row.body)}</textarea>
              </div>

              <div class="img-row">
                <div class="thumb-box">${imgPreview}</div>
                <div>
                  <div class="field" style="margin-bottom: 6px;">
                    <label>URL Gambar</label>
                    <input type="url" data-field="image_url" value="${escapeAttr(row.image_url)}" placeholder="https://..." />
                  </div>
                  <div class="upload-bar">
                    <input type="file" accept="image/*" class="file-input-hidden" data-upload-file />
                    <button type="button" class="btn btn-outline upload-trigger-btn">Pilih &amp; Kompres Foto</button>
                    <span class="compress-badge">Auto-compress aktif (maks 2048px, Q90)</span>
                  </div>
                  <div class="field" style="margin-top: 10px; margin-bottom: 0;">
                    <label>Teks Alternatif Gambar (Alt SEO)</label>
                    <input type="text" data-field="image_alt" value="${escapeAttr(row.image_alt)}" />
                  </div>
                </div>
              </div>

              ${extraFieldsHtml}

              <div class="check-row">
                <label class="check-label">
                  <input type="checkbox" data-field="is_active" ${row.is_active !== false ? 'checked' : ''} />
                  Tampilkan bagian ini di halaman publik
                </label>
                <button type="button" class="btn btn-primary save-btn" data-save-key="${escapeAttr(k)}">Simpan Perubahan</button>
              </div>
            </article>
          `;
        }).join('');

        container.querySelectorAll('.section-card').forEach((card) => {
          const sectionKey = card.dataset.key;
          const urlInput = card.querySelector('input[data-field="image_url"]');
          const thumbBox = card.querySelector('.thumb-box');
          const fileInput = card.querySelector('input[data-upload-file]');
          const triggerBtn = card.querySelector('.upload-trigger-btn');

          urlInput.addEventListener('input', () => {
            const url = urlInput.value.trim();
            thumbBox.innerHTML = url ? `<img src="${escapeAttr(url)}" alt="Preview" />` : '<span>Tanpa gambar</span>';
          });

          triggerBtn.addEventListener('click', () => fileInput.click());

          fileInput.addEventListener('change', () => {
            const file = fileInput.files && fileInput.files[0];
            if (file) {
              handleImageUpload(sectionKey, file, card, triggerBtn);
              fileInput.value = '';
            }
          });
        });

        container.querySelectorAll('.save-btn').forEach((btn) => {
          btn.addEventListener('click', () => saveSection(btn.dataset.saveKey, btn));
        });
      }

      async function loadSections() {
        try {
          const res = await fetch(
            `${SUPABASE_URL}/rest/v1/wr_rahayu_sections?select=*&order=sort_order.asc`,
            {
              headers: {
                apikey: API_KEY,
                Authorization: `Bearer ${API_KEY}`
              }
            }
          );

          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`Gagal memuat konten (${res.status}): ${errText}`);
          }

          const data = await res.json();
          latestRows = Array.isArray(data) ? data : [];
          renderCards(latestRows);
          showStatus('ok', 'Konten berhasil dimuat.');
        } catch (err) {
          showStatus('err', err.message || 'Terjadi kesalahan saat memuat konten.');
        }
      }

      async function saveSection(sectionKey, btnEl) {
        const card = container.querySelector(`.section-card[data-key="${sectionKey}"]`);
        if (!card) return;

        const val = (f) => {
          const el = card.querySelector(`[data-field="${f}"]`);
          return el ? el.value : '';
        };
        const checked = card.querySelector('[data-field="is_active"]').checked;

        const payload = {
          eyebrow: val('eyebrow'),
          title: val('title'),
          body: val('body'),
          image_url: val('image_url'),
          image_alt: val('image_alt'),
          is_active: checked,
          updated_at: new Date().toISOString()
        };

        if (!String(sectionKey || '').startsWith('gallery_')) {
          payload.extra_1_label = val('extra_1_label');
          payload.extra_1_value = val('extra_1_value');
          payload.extra_2_label = val('extra_2_label');
          payload.extra_2_value = val('extra_2_value');
        }

        const originalLabel = btnEl.textContent;
        btnEl.disabled = true;
        btnEl.textContent = 'Menyimpan...';

        try {
          const res = await fetch(
            `${SUPABASE_URL}/rest/v1/wr_rahayu_sections?section_key=eq.${encodeURIComponent(sectionKey)}`,
            {
              method: 'PATCH',
              headers: {
                apikey: API_KEY,
                Authorization: `Bearer ${API_KEY}`,
                'Content-Type': 'application/json',
                Prefer: 'return=representation'
              },
              body: JSON.stringify(payload)
            }
          );

          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`Gagal menyimpan "${sectionKey}" (${res.status}): ${errText}`);
          }

          latestRows = latestRows.map((item) =>
            item.section_key === sectionKey ? { ...item, ...payload } : item
          );

          showStatus('ok', `Perubahan "${getSectionLabel(sectionKey)}" berhasil disimpan.`);
        } catch (err) {
          showStatus('err', err.message || 'Gagal menyimpan perubahan.');
        } finally {
          btnEl.disabled = false;
          btnEl.textContent = originalLabel;
        }
      }

      galleryBatchBtn.addEventListener('click', () => galleryBatchInput.click());
      galleryBatchInput.addEventListener('change', () => {
        const files = Array.from(galleryBatchInput.files || []);
        if (files.length > 0) {
          handleBatchGalleryUpload(files);
          galleryBatchInput.value = '';
        }
      });

      reloadBtn.addEventListener('click', loadSections);
      loadSections();
    })();
  </script>
</body>
</html>
